<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TaskFlow - Manage Your Daily Tasks</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Auth Screen -->
  <div id="auth-screen">
    <div class="card">
      <h1>TaskFlow</h1>
      <div class="tabs">
        <button id="tab-login" class="tab active" onclick="switchTab('login')">Sign In</button>
        <button id="tab-register" class="tab" onclick="switchTab('register')">Sign Up</button>
      </div>
      <div id="auth-login">
        <input type="email"    id="login-email"    placeholder="Email address" />
        <input type="password" id="login-password" placeholder="Password" />
        <button class="btn-primary" onclick="login()">Sign In</button>
        <div class="divider">or</div>
        <button class="btn-google" onclick="loginWithGoogle()">
          <svg width="18" height="18" viewBox="0 0 18 18">
            <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/>
            <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/>
            <path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.175 0 7.55 0 9s.348 2.825.957 4.039l3.007-2.332z"/>
            <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
          </svg>
          Sign in with Google
        </button>
      </div>
      <div id="auth-register" class="hidden">
        <input type="text"     id="reg-name"     placeholder="Full name" />
        <input type="email"    id="reg-email"    placeholder="Email address" />
        <input type="password" id="reg-password" placeholder="Password" />
        <button class="btn-primary" onclick="register()">Create Account</button>
        <div class="divider">or</div>
        <button class="btn-google" onclick="loginWithGoogle()">
          <svg width="18" height="18" viewBox="0 0 18 18">
            <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/>
            <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/>
            <path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.175 0 7.55 0 9s.348 2.825.957 4.039l3.007-2.332z"/>
            <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
          </svg>
          Sign up with Google
        </button>
      </div>
      <p id="auth-msg" class="msg"></p>
    </div>
  </div>

  <!-- App Screen -->
  <div id="app-screen" class="hidden">
    <header>
      <h1>TaskFlow</h1>
      <div class="header-right">
        <span id="user-name"></span>
        <button class="btn-outline" onclick="logout()">Sign Out</button>
      </div>
    </header>

    <main>
      <!-- Add Task -->
      <div class="add-form card">
        <input type="text"  id="task-title" placeholder="What needs to be done?" />
        <textarea           id="task-desc"  placeholder="Add details (optional)"></textarea>
        <button class="btn-primary" onclick="addTask()">Add Task</button>
        <p id="task-msg" class="msg"></p>
      </div>

      <!-- Pending -->
      <section>
        <h2>To Do <span id="pending-count" class="count"></span></h2>
        <div id="pending-list"></div>
      </section>

      <!-- Completed -->
      <section>
        <h2>Completed <span id="completed-count" class="count"></span></h2>
        <div id="completed-list"></div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
